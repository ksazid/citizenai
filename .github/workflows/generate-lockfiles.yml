name: Generate dependency lockfiles

on:
  push:
    branches: [security/reproducible-dependency-locks]

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: ${{ !contains(github.event.head_commit.message, '[lockfiles-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate API lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate mobile lockfile
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
            exit 0
          fi
          git commit -m "chore: lock dependency graph [lockfiles-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
