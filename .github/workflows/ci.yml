name: PES v2 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run preflight

  runtime-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: citizenai
          POSTGRES_PASSWORD: citizenai
          POSTGRES_DB: citizenai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citizenai -d citizenai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Run PostgreSQL runtime integration
        env:
          CITIZENAI_TEST_DATABASE_URL: postgresql://citizenai:citizenai@127.0.0.1:5432/citizenai
          PGSSL: disable
        run: node --test test/citizenai/runtime-postgres.test.mjs

  uk-source-snapshot-backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture every authoritative UK source body
        run: node scripts/capture-uk-source-snapshots.mjs
      - name: Upload exact source-body hash manifest
        uses: actions/upload-artifact@v4
        with:
          name: citizenai-uk-source-snapshots
          path: .artifacts/uk-source-snapshots.json
          if-no-files-found: error

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  visual-anchor-capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - run: npm install --no-audit --no-fund
      - run: npx expo export --platform web --output-dir dist
      - name: Capture approved visual anchors
        run: |
          mkdir -p screenshots
          python3 -m http.server 4173 --directory dist >/tmp/citizenai-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 3
          for SCREEN in welcome diagnostic-result home compare-concepts pass-ready; do
            URL="http://127.0.0.1:4173/?screen=${SCREEN}"
            google-chrome --headless --disable-gpu --no-sandbox --dump-dom "$URL" > "screenshots/${SCREEN}.html"
            grep -q "CitizenAI" "screenshots/${SCREEN}.html"
            google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=430,932 --screenshot="screenshots/${SCREEN}.png" "$URL"
          done
          test -s screenshots/welcome.png
          test -s screenshots/diagnostic-result.png
          test -s screenshots/home.png
          test -s screenshots/compare-concepts.png
          test -s screenshots/pass-ready.png
      - uses: actions/upload-artifact@v4
        with:
          name: citizenai-approved-anchor-screenshots
          path: apps/mobile/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: citizenai-ui-source-snapshot
          path: |
            apps/mobile/src/components.tsx
            apps/mobile/src/screens.tsx
            apps/mobile/src/theme.ts
          if-no-files-found: error

  uk-release-package:
    needs: [validate, uk-source-snapshot-backfill, mobile-typecheck, visual-anchor-capture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build certified active UK pack
        run: node scripts/build-uk-release-package.mjs
      - name: Upload immutable UK release package
        uses: actions/upload-artifact@v4
        with:
          name: citizenai-uk-pack-2026.09.02.1
          path: .artifacts/citizenai-uk-pack-2026.09.02.1.json
          if-no-files-found: error
